{% extends "base.html" %}
{% block content %}
<section class="auth-section">
  <div class="auth-container auth-container-sm">
    <div class="auth-right">
      <div class="auth-card">
        <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">

          <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" name="email" required/>
          </div>

          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" name="password" required/>
            <p style="text-align:right;margin-top:0.3rem;font-size:0.82rem">
              <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
            </p>
          </div>

          <div class="role-toggle">
            <label class="role-option">
              <input type="radio" name="role" value="donor" required/>
              <span><i class="fas fa-hand-holding-heart"></i> Donor</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="receiver"/>
              <span><i class="fas fa-user-injured"></i> Recipient</span>
            </label>
          </div>

          <div class="form-group">
            <label><i class="fas fa-heartbeat"></i> Organ</label>
            <select name="organ" required>
              <option value="">Select Organ</option>
              {% for organ in organs %}
              <option value="{{ organ }}">{{ organ }}</option>
              {% endfor %}
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
      </div>
    </div>
  </div>
</section>

<section class="auth-info-strip">
  <div class="auth-info-inner">
    <div class="auth-info-item"><i class="fas fa-heartbeat"></i> Welcome Back</div>
    <div class="auth-info-item"><i class="fas fa-check-circle"></i> Select your role &amp; organ</div>
    <div class="auth-info-item"><i class="fas fa-check-circle"></i> View your matches</div>
    <div class="auth-info-item"><i class="fas fa-check-circle"></i> Stay connected</div>
  </div>
  <p class="auth-info-quote">"Your decision to donate can turn someone's end into a new beginning."</p>
</section>
{% endblock %}
