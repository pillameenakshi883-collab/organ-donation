{% extends "base.html" %}
{% block content %}
<section class="auth-section">
  <div class="auth-container auth-container-sm">
    <div class="auth-right">
      <div class="auth-card">
        <h2><i class="fas fa-lock"></i> Reset Password</h2>
        <p style="color:var(--gray);margin-bottom:1rem;font-size:0.9rem">Choose a strong new password.</p>
        <form method="POST" action="{{ url_for('reset_password') }}" class="auth-form">
          <div class="form-group">
            <label><i class="fas fa-lock"></i> New Password</label>
            <input type="password" name="password" id="resetPassword" required placeholder="New password" oninput="checkStrength(this.value)"/>
            <div class="pw-strength-bar"><div id="pwBar"></div></div>
            <small id="pwHint" style="color:var(--gray);font-size:0.78rem">Min 8 chars, 1 uppercase, 1 number, 1 special character</small>
          </div>
          <div class="form-group">
            <label><i class="fas fa-lock"></i> Confirm Password</label>
            <input type="password" name="confirm_password" required placeholder="Confirm new password"/>
          </div>
          <button type="submit" class="btn btn-primary btn-full">
            <i class="fas fa-check"></i> Reset Password
          </button>
        </form>
        <p class="auth-switch"><a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
      </div>
    </div>
  </div>
</section>
<script>
function checkStrength(pw) {
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[!@#$%^&*(),.?":{}|<>_\-]/.test(pw)) score++;
  const bar = document.getElementById('pwBar');
  const colors = ['#e74c3c','#e67e22','#f1c40f','#27ae60'];
  const labels = ['Weak','Fair','Good','Strong'];
  bar.style.width = (score * 25) + '%';
  bar.style.background = colors[score - 1] || '#e74c3c';
  document.getElementById('pwHint').textContent = score === 4 ? '✅ Strong password' : labels[score-1] || 'Too weak';
}
</script>
{% endblock %}
