{% extends "base.html" %}
{% block content %}
<section class="auth-section">
  <div class="auth-container auth-container-sm">
    <div class="auth-right">
      <div class="auth-card">
        <h2><i class="fas fa-key"></i> Forgot Password</h2>
        <p style="color:var(--gray);margin-bottom:1rem;font-size:0.9rem">Enter your registered email to reset your password.</p>
        <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
          <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" name="email" required placeholder="Enter your registered email"/>
          </div>
          <button type="submit" class="btn btn-primary btn-full">
            <i class="fas fa-arrow-right"></i> Continue
          </button>
        </form>
        <p class="auth-switch"><a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
